<!DOCTYPE html>

<html>

<head>
    <title>Grayscale Image Converter</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f2f2f2;
        padding: 30px;
    }

    .container {
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        max-width: 1000px;
        margin: auto;
    }

    h1 {
        color: #333;
    }

    form {
        margin-top: 20px;
    }

    input[type="file"] {
        padding: 10px;
    }

    input[type="submit"] {
        padding: 10px 20px;
        background-color: #333;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    input[type="submit"]:hover {
        background-color: #555;
    }

    .images {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-top: 30px;
        flex-wrap: wrap;
    }

    .image-box {
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 10px;
        background-color: #fafafa;
    }

    img {
        max-width: 400px;
        max-height: 400px;
        border-radius: 5px;
    }

    .error {
        color: red;
        font-weight: bold;
    }
</style>

</head>

<body>

<div class="container">

<h1>Grayscale Image Converter</h1>

<p>Select an image and click the button.</p>

<form method="POST" enctype="multipart/form-data">

    <input
        type="file"
        name="file"
        accept="image/*"
        required
    >

    <br><br>

    <input
        type="submit"
        value="Upload and Convert"
    >

</form>


    <p class="error"></p>



    <div class="images">

        <div class="image-box">

            <h2>Original Image</h2>

            <img
                src="data:image/jpeg;base64,{{ original_image }}"
                alt="Original Image"
            >

        </div>


        <div class="image-box">

            <h2>Grayscale Image</h2>

            <img
                src="data:image/jpeg;base64,{{ grayscale_image }}"
                alt="Grayscale Image"
            >

        </div>

    </div>


</div>

</body>

</html>
